# wlwallpick configuration
# Place at ~/.config/wlwallpick/wlwallpick.conf
#
# Uncomment and adjust values as needed.
# Missing values fall back to defaults shown below.

# Colors (hex RGB format)
background       = #1a1b26
border_selected  = #ad8ee6

# Thumbnail size (pixels)
thumb_width      = 200
thumb_height     = 150

# Spacing (pixels)
padding          = 10
border_width     = 3

# Initial window size (pixels)
win_width        = 900
win_height       = 600

# Mouse wheel scroll step (pixels)
scroll_step      = 40

# Supported image extensions (comma separated)
exts = .jpg,.jpeg,.png,.bmp,.gif,.webp,.tga
