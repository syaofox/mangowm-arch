# 更多选项请参考官方 Wiki: https://github.com/DreamMaoMao/mango/wiki/

# --- 变量 ---
# NVIDIA 专用环境变量
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=WLR_NO_HARDWARE_CURSORS,1
env=LIBVA_DRIVER_NAME,nvidia
env=XDG_SESSION_TYPE,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland

# 系统底层必要设置 (不在 conf 里的步骤)
# 注意： 仅仅设置变量是不够的，你还必须确保内核开启了 KMS (Kernel Mode Setting)。
# 编辑内核参数：在 /etc/default/grub 的 GRUB_CMDLINE_LINUX_DEFAULT 中添加 nvidia_drm.modeset=1。
# 更新 Grub：运行 sudo grub-mkconfig -o /boot/grub/grub.cfg。
# initcpio 设置：在 /etc/mkinitcpio.conf 的 MODULES 数组中添加：
# MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
# 然后运行 sudo mkinitcpio -P 重新生成。

# 软件兼容性
env=QT_QPA_PLATFORM,wayland
env=GDK_BACKEND,wayland

# 主题与应用后端
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt5ct
env=XDG_CURRENT_DESKTOP,Mango

# --- 窗口特效 (Window effect) ---
# 是否启用窗口模糊 (0禁用, 1启用)
blur=0
# 是否对图层（如状态栏）启用模糊
blur_layer=0
# 是否启用模糊优化
blur_optimized=1
# 模糊处理次数
blur_params_num_passes = 2
# 模糊半径
blur_params_radius = 5
# 模糊噪声强度
blur_params_noise = 0.02
# 模糊后的亮度
blur_params_brightness = 0.9
# 模糊后的对比度
blur_params_contrast = 0.9
# 模糊后的饱和度
blur_params_saturation = 1.2

# 是否启用窗口阴影
shadows = 0
# 是否为图层启用阴影
layer_shadows = 0
# 是否仅在浮动窗口上显示阴影
shadow_only_floating = 1
# 阴影大小
shadows_size = 10
# 阴影模糊程度
shadows_blur = 15
# 阴影 X 轴偏移
shadows_position_x = 0
# 阴影 Y 轴偏移
shadows_position_y = 0
# 阴影颜色 (RGBA)
shadowscolor= 0x000000ff

# 窗口圆角半径
border_radius=0
# 当只有一个窗口时是否禁用圆角
no_radius_when_single=0
# 聚焦窗口的不透明度
focused_opacity=1.0
# 非聚焦窗口的不透明度
unfocused_opacity=1

# --- 动画配置 (Animation Configuration) ---
# 支持类型: zoom (缩放), slide (滑动)
# tag_animation_direction: 1-横向切换, 0-纵向切换
# 是否启用动画
animations=1
# 是否启用图层动画
layer_animations=1
# 窗口打开时的动画类型
animation_type_open=slide
# 窗口关闭时的动画类型
animation_type_close=slide
# 是否启用淡入效果
animation_fade_in=1
# 是否启用淡出效果
animation_fade_out=1
# 标签（工作区）切换动画方向
tag_animation_direction=1
# 缩放动画初始比例
zoom_initial_ratio=0.4
# 缩放动画结束比例
zoom_end_ratio=0.8
# 淡入起始透明度
fadein_begin_opacity=0.5
# 淡出起始透明度
fadeout_begin_opacity=0.8
# 窗口移动动画耗时 (毫秒)
animation_duration_move=125
# 窗口打开动画耗时
animation_duration_open=100
# 标签切换动画耗时
animation_duration_tag=80
# 窗口关闭动画耗时
animation_duration_close=200
# 焦点切换动画耗时
animation_duration_focus=0
# 动画曲线设置 (三次贝塞尔曲线参数)
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# --- 滚轮/滚动布局设置 (Scroller Layout Setting) ---
# 滚动布局结构限制
scroller_structs=20
# 滚动窗口默认占据屏幕的比例
scroller_default_proportion=0.8
# 聚焦窗口是否保持在中心
scroller_focus_center=0
# 是否倾向于居中显示
scroller_prefer_center=0
# 边缘滚动时鼠标跟随聚焦
edge_scroller_pointer_focus=1
# 单个窗口时的比例
scroller_default_proportion_single=1.0
# 滚动比例预设值
scroller_proportion_preset=0.5,0.8,1.0

# --- 主次布局设置 (Master-Stack Layout Setting) ---
# 新窗口是否作为主窗口 (Master)
new_is_master=0
# 默认主窗口占据的比例
default_mfact=0.55
# 默认主窗口的数量
default_nmaster=1
# 智能间隙 (只有一个窗口时自动隐藏间隙)
smartgaps=0

# --- 总览/缩略图设置 (Overview Setting) ---
# 热区大小（触发总览的边缘像素）
hotarea_size=10
# 是否启用热区触发
enable_hotarea=1
# 总览模式下的标签显示方式
ov_tab_mode=0
# 总览模式内间隙
overviewgappi=5
# 总览模式外间隙
overviewgappo=30

# --- 杂项设置 (Misc) ---
# 只保留 tile 和 scroller 布局，switch_layout 仅在这两者间切换
circle_layout=tile,scroller
# 只有一个窗口时是否隐藏边框
no_border_when_single=0
# 轴绑定触发超时时间
axis_bind_apply_timeout=100
# 窗口请求激活时是否自动聚焦
focus_on_activate=1
# 忽略可见窗口的空闲抑制
idleinhibit_ignore_visible=0
# 鼠标跟随聚焦 (鼠标移动到窗口即获取焦点)
sloppyfocus=0
# 聚焦切换时光标是否自动跳转到窗口中心
warpcursor=0
# 焦点是否允许跨显示器切换
focus_cross_monitor=0
# 焦点是否允许跨标签切换
focus_cross_tag=0
# 是否启用浮动窗口吸附
enable_floating_snap=0
# 吸附感应距离
snap_distance=30
# 光标大小
cursor_size=24
# 是否允许平铺窗口之间相互拖动
drag_tile_to_tile=1
# 平铺拖动时是否显示小型缩略图
drag_tile_small=1

# --- 键盘设置 (keyboard) ---
# 键盘重复频率
repeat_rate=25
# 键盘重复延迟
repeat_delay=600
# 启动时是否开启数字锁定键
numlockon=1
# 键盘布局 (美国英语)
xkb_rules_layout=us

# --- 触控板设置 (Trackpad) ---
# 需要重新登录方可生效
# 是否禁用触控板
disable_trackpad=1
# 是否启用轻点点击
tap_to_click=1
# 是否启用轻点拖拽
tap_and_drag=1
# 拖拽锁定
drag_lock=1
# 是否启用自然滚动 (反向滚动)
trackpad_natural_scrolling=0
# 打字时自动禁用触控板
disable_while_typing=1
# 左手模式
left_handed=0
# 模拟鼠标中键
middle_button_emulation=0
# 滑动触发的最小阈值
swipe_min_threshold=1

# --- 鼠标设置 (mouse) ---
# 需要重新登录方可生效
# 鼠标自然滚动
mouse_natural_scrolling=0

# --- 外观设置 (Appearance) ---
# 窗口间水平内间隙
gappih=2
# 窗口间垂直内间隙
gappiv=2
# 窗口与屏幕边缘的水平外间隙
gappoh=4
# 窗口与屏幕边缘的垂直外间隙
gappov=4
# 便签窗口宽度比例
scratchpad_width_ratio=0.8
# 便签窗口高度比例
scratchpad_height_ratio=0.9
# 窗口边框宽度
borderpx=2
source=./colors.conf

# --- 标签页/工作区布局规则 (layout support) ---
# 支持布局: tile(平铺), scroller(滚动), grid(网格), deck(层叠), monocle(单窗口), 
# center_tile(中心平铺), vertical_tile(纵向平铺), vertical_scroller(纵向滚动)
# 标签1 默认平铺布局
tagrule=id:1,layout_name:scroller
# 标签2 默认平铺布局
tagrule=id:2,layout_name:tile
# 标签3 默认平铺布局
tagrule=id:3,layout_name:tile
# 标签4 默认平铺布局
tagrule=id:4,layout_name:tile
# 标签5 默认平铺布局
tagrule=id:5,layout_name:tile
# 标签6 默认平铺布局
tagrule=id:6,layout_name:tile
# 标签7 默认平铺布局
tagrule=id:7,layout_name:tile
# 标签8 默认平铺布局
tagrule=id:8,layout_name:tile
# 标签9 默认平铺布局
tagrule=id:9,layout_name:tile

# --- 按键绑定 (Key Bindings) ---
# 修饰键名称: super, ctrl, alt, shift, none

# --- 路径变量定义 ---
env=MANGO_SCRIPTS,$HOME/.config/mango


# 重载配置
# Super+R: 重新加载配置文件
bind=SUPER,r,reload_config

# 应用与功能
# 启动器
bind=SUPER,space,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh launcher"
# 终端
bind=SUPER,Return,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh terminal"
# TUI文件管理器 (Yazi)
bind=SUPER,e,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh yazi"
# GUI文件管理器
bind=SUPER+SHIFT,e,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh file_gui"
# 截图到剪贴板
bind=SUPER,a,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh shot_copy"
# 截图到保存文件夹
bind=SUPER+SHIFT,a,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh shot_save"
# 主题切换
bind=SUPER+SHIFT,t,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh switch_theme"
# 壁纸选择
bind=SUPER+SHIFT,w,spawn,sh -c "$HOME/.local/bin/switch-wallpaper.sh"
# 独立脚本启动浏览器
bind=SUPER,w,spawn,sh -c "$MANGO_SCRIPTS/run-browser.sh"
# 剪贴板历史记录
bind=SUPER,v,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh clipboard"
# 清除剪贴板历史
bind=SUPER+SHIFT,v,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh clipboard_wipe"
# 锁屏
bind=SUPER+SHIFT,l,spawn,sh -c "$MANGO_SCRIPTS/mangocmd.sh lock"

# 退出
# Super+M: 退出 Mango
# bind=SUPER+SHIFT,q,quit
# Alt+Q: 关闭当前窗口
bind=SUPER,q,killclient,
# 关机菜单
bind=SUPER+SHIFT,q,spawn,sh -c "$MANGO_SCRIPTS/rofi-sysact.sh"
# bind=CTL+ALT,q,spawn,sh -c "wlogout -b 2"

# 切换窗口焦点
# Super+Tab: 切换下一个窗口焦点
bind=SUPER,Tab,focusstack,next
# Alt+左: 聚焦左侧窗口
bind=ALT,Left,focusdir,left
# Alt+右: 聚焦右侧窗口
bind=ALT,Right,focusdir,right
# Alt+上: 聚焦上方窗口
bind=ALT,Up,focusdir,up
# Alt+下: 聚焦下方窗口
bind=ALT,Down,focusdir,down

# 交换窗口位置
# Super+Shift+上: 与上方窗口交换
bind=SUPER+SHIFT,Up,exchange_client,up
# Super+Shift+下: 与下方窗口交换
bind=SUPER+SHIFT,Down,exchange_client,down
# Super+Shift+左: 与左侧窗口交换
bind=SUPER+SHIFT,Left,exchange_client,left
# Super+Shift+右: 与右侧窗口交换
bind=SUPER+SHIFT,Right,exchange_client,right

# 切换窗口状态
# Super+G: 切换全局窗口状态
bind=SUPER,g,toggleglobal,
# Alt+Tab: 切换总览模式
bind=ALT,Tab,toggleoverview,
# Alt+\: 切换浮动状态
bind=ALT,backslash,togglefloating,
# Alt+A: 切换最大化
bind=ALT,a,togglemaximizescreen,
# Alt+F: 切换全屏
bind=ALT,f,togglefullscreen,
# Super+I: 最小化窗口
bind=SUPER,i,minimized,
# Super+O: 切换覆盖层模式
bind=SUPER,o,toggleoverlay,
# Super+Shift+I: 恢复最小化窗口
bind=SUPER+SHIFT,I,restore_minimized

# Alt+Z: 呼出/隐藏便签本
bind=ALT,z,toggle_scratchpad

# 滚动布局特定设置
# Alt+E: 设置比例为 1.0
bind=ALT,e,set_proportion,1.0
# Alt+X: 切换比例预设
bind=ALT,x,switch_proportion_preset,

# 切换布局
# Super+N: 循环切换布局模式
bind=SUPER,n,switch_layout

# 标签页/工作区切换
# Super+左: 切换到左边标签
bind=SUPER,Left,viewtoleft,0
# Ctrl+左: 切换到左边有窗口的标签
bind=CTRL,Left,viewtoleft_have_client,0
# Super+右: 切换到右边标签
bind=SUPER,Right,viewtoright,0
# Ctrl+右: 切换到右边有窗口的标签
bind=CTRL,Right,viewtoright_have_client,0
# Ctrl+Super+左: 将当前窗口移动到左边标签
bind=CTRL+SUPER,Left,tagtoleft,0
# Ctrl+Super+右: 将当前窗口移动到右边标签
bind=CTRL+SUPER,Right,tagtoright,0

# Ctrl + 数字: 切换到对应标签 (工作区)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Alt + 数字: 将当前窗口移动到对应标签
# tag: 移动并跟随焦点, tagsilent: 只移动不跟随焦点
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# 多显示器切换
# bind=alt+shift,Left,focusmon,left    # Alt+Shift+左: 焦点移动到左边显示器
# bind=alt+shift,Right,focusmon,right  # Alt+Shift+右: 焦点移动到右边显示器
# bind=SUPER+Alt,Left,tagmon,left      # Super+Alt+左: 将窗口移动到左边显示器
# bind=SUPER+Alt,Right,tagmon,right    # Super+Alt+右: 将窗口移动到右边显示器

# 窗口间隙调节 (Gaps)
# bind=ALT+SHIFT,X,incgaps,1           # Alt+Shift+X: 增大间隙
# bind=ALT+SHIFT,Z,incgaps,-1          # Alt+Shift+Z: 减小间隙
# bind=ALT+SHIFT,R,togglegaps          # Alt+Shift+R: 切换间隙开启/关闭

# 精确移动窗口 (仅限浮动模式)
# 向上移动 50 像素
bind=CTRL+SHIFT,Up,movewin,+0,-50
# 向下移动 50 像素
bind=CTRL+SHIFT,Down,movewin,+0,+50
# 向左移动 50 像素
bind=CTRL+SHIFT,Left,movewin,-50,+0
# 向右移动 50 像素
bind=CTRL+SHIFT,Right,movewin,+50,+0

# 调整窗口大小 (仅限浮动模式)
# 高度减小 50 像素
bind=CTRL+ALT,Up,resizewin,+0,-50
# 高度增加 50 像素
bind=CTRL+ALT,Down,resizewin,+0,+50
# 宽度减小 50 像素
bind=CTRL+ALT,Left,resizewin,-50,+0
# 宽度增加 50 像素
bind=CTRL+ALT,Right,resizewin,+50,+0

# --- 鼠标绑定 (Mouse Button Bindings) ---
# btn_left(左键) 和 btn_right(右键) 必须配合修饰键使用
# Super+左键拖拽: 移动窗口
mousebind=SUPER,btn_left,moveresize,curmove
# 中键点击: 切换最大化
mousebind=NONE,btn_middle,togglemaximizescreen,0
# Super+右键拖拽: 调整窗口大小
mousebind=SUPER,btn_right,moveresize,curresize

# --- 媒体键 (Media Keys) ---
bind=NONE,XF86AudioRaiseVolume,spawn,sh -c "$MANGO_SCRIPTS/volume.sh up"
bind=NONE,XF86AudioLowerVolume,spawn,sh -c "$MANGO_SCRIPTS/volume.sh down"
bind=NONE,XF86AudioMute,spawn,sh -c "$MANGO_SCRIPTS/volume.sh mute"

# --- 滚轮/轴绑定 (Axis Bindings) ---
# Super+滚轮上: 切换到左侧有窗口的工作区
axisbind=SUPER,UP,viewtoleft_have_client
# Super+滚轮下: 切换到右侧有窗口的工作区
axisbind=SUPER,DOWN,viewtoright_have_client

# --- 窗口规则 (Window Rule) ---
# 语法: windowrule=参数:值,appid:^(regex)$ | title:^(regex)$
# 参数: isfloating, isoverlay(置顶), tags(标签), isnoborder, monitor, offsetx/y, width/height ...
# 应用在标签9 (1<<8)，平铺
windowrule=tags:9,appid:^(FreeFileSync)$
windowrule=tags:9,appid:^(Localsend)$
# 浮动 + 置顶（多媒体/工具类）
windowrule=isfloating:1,isoverlay:1,appid:^(mpv)$
windowrule=isfloating:1,isoverlay:1,appid:^(Io\.github\.celluloid_player\.Celluloid)$
windowrule=isfloating:1,isoverlay:1,appid:^(Xviewer)$
windowrule=isfloating:1,isoverlay:1,appid:^(xfce4-clipman-history)$
windowrule=isfloating:1,isoverlay:1,appid:^(org\.gnome\.FileRoller)$
windowrule=isfloating:1,isoverlay:1,appid:^(zenity)$
# 浮动（不置顶）
windowrule=isfloating:1,appid:^(yazi-float)$
windowrule=isfloating:1,appid:^(wlwallpick)$
# --- 图层规则 (Layer Rule) ---
# 为特定的程序图层（如 Rofi）应用特殊动画
# Rofi 打开时使用缩放动画
layerrule=animation_type_open:zoom,layer_name:rofi
# Rofi 关闭时使用缩放动画
layerrule=animation_type_close:zoom,layer_name:rofi


# ============================================================
# 自启动与环境同步 (Autostart & DBus)
# ============================================================
# --- 环境初始化 ---
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets

# --- 基础 UI 组件 ---
exec-once = waybar
exec-once = $HOME/.local/bin/init-wallpaper.sh
exec-once = fcitx5 -d --replace

# --- 剪贴板核心 (Cliphist) ---
# 使用 sleep 2 确保合成器完全启动后再挂载监听器，防止启动失败
exec-once = sleep 2 && wl-paste --type text --watch cliphist store 
exec-once = sleep 2 && wl-paste --type image --watch cliphist store
exec-once = mako
exec-once = sh -c "$MANGO_SCRIPTS/mangocmd.sh idle"

# (可选) 如果你偶尔需要清理旧数据，可以加上这行，只保留最近 1000 条
# exec-once = cliphist wipe-older 1000

# env=GTK_THEME,Adwaita-dark

# 自动设置 GTK 主题、图标和字体 — 由 switch-theme.sh 按主题重写
exec-once = sh -c "$MANGO_SCRIPTS/set-gtk-theme.sh"

# exec-once=gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'